[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-router"
dynamic = ["version"]
description = "Reparte tus tareas entre los CLIs oficiales de IA (claude, codex, agy) con métricas objetivas de Arena y Artificial Analysis."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Mgobeaalcoba" }]
keywords = ["ai", "llm", "router", "cli", "claude", "codex", "gemini", "benchmarks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Spanish",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
dependencies = []  # solo librería estándar

[project.urls]
Homepage = "https://www.mgatc.com/recursos/ia-router/"
Source = "https://github.com/Mgobeaalcoba/ia-suscription-router"
Author = "https://github.com/Mgobeaalcoba"

[project.scripts]
ia-router = "ia_router.cli:main"

[tool.setuptools]
packages = ["ia_router", "ia_router.data"]

[tool.setuptools.package-data]
"ia_router.data" = ["*.json"]

[tool.setuptools.dynamic]
version = { attr = "ia_router.__version__" }
