name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: Signed-off commits (DCO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every pull request commit
        run: tools/check_dco.sh "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
