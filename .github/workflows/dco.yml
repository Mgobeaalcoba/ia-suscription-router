name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: Commits firmados (DCO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar Signed-off-by en cada commit del pull request
        run: tools/check_dco.sh "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
